## ngPost configuration for the container image.
##
## The image points XDG_CONFIG_HOME at /config, so ngPost reads
## /config/ngPost/ngPost.conf. Copy this file there and edit the [server]
## block:
##
##   mkdir -p config/ngPost data/input data/nzb data/tmp
##   cp ngPost.docker.conf config/ngPost/ngPost.conf
##   chmod 600 config/ngPost/ngPost.conf
##   docker run --rm -v "$PWD/config:/config" -v "$PWD/data:/data" \
##       ngpost --auto /data/input
##
## This file holds your NNTP credentials and, if you set one, your fixed
## archive password: keep it readable by you alone.

lang = EN

nzbPath  = /data/nzb
inputDir = /data/input
TMP_DIR  = /data/tmp

## the posting history is a SQLite database since v5
POST_DB = /data/history.sqlite

## The image ships 7-Zip and par2cmdline, both free software. rar is non-free
## and cannot be redistributed in an image: to use it, mount your own binary
## and set RAR_TOOL = rar, RAR_SOURCE = custom and RAR_PATH to it.
RAR_TOOL   = 7zip
RAR_SOURCE = auto

PAR2_TOOL   = par2cmdline
PAR2_SOURCE = auto
PAR2_PCT    = 8

## the groups you post to, and the poster ngPost signs with
GROUPS = alt.binaries.test
FROM   = poster@example.com

## BAR is fine on a terminal; NONE keeps the logs of an unattended run readable
DISP_PROGRESS = BAR

## The integrated VPN is not supported in the image: a tunnel needs NET_ADMIN,
## /dev/net/tun and a volatile /run. Put the container behind your VPN instead.

[server]
host = news.example.com
port = 563
ssl  = true
user = myUser
pass = myPass
connection = 30
enabled = true
nzbCheck = false
