name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes this run: finishing it only delays the result that
# matters and holds a runner. Release publishing keeps its own group and is
# deliberately never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: C++ format (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the base of the pushed range must be in the clone to diff against
          fetch-depth: 0

      # Pinned by version and hash: clang-format output changes between major
      # versions, and this is the one .clang-format was calibrated with.
      - name: Install clang-format 18
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          echo "clang-format==18.1.8 --hash=sha256:2de122b8aa78ba49e326f974131caab2c79f4ae877c227cd4e3e5d82a98d21e5" \
            > "$RUNNER_TEMP/clang-format-requirements.txt"
          "$RUNNER_TEMP/clang-format/bin/pip" install --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/clang-format-requirements.txt"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-format.sh "$BASE_SHA"

  lint:
    name: Scripts and workflows lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned by version and hash, like clang-format: the runner's own
      # shellcheck (0.9) and a newer one disagree on what they report, and a
      # linter whose verdict depends on the machine is no gate.
      - name: Install shellcheck, ruff and actionlint
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          {
            echo "shellcheck-py==0.11.0.1 --hash=sha256:1b274df81de5b000ff78db433e7328b87e52e3c38481c60f8e488c3095beef05"
            echo "ruff==0.16.8 --hash=sha256:15e7d226246961db9235098333caa13063906d3851136b84c2900b82f5daa1df"
          } > "$RUNNER_TEMP/lint-requirements.txt"
          "$RUNNER_TEMP/lint/bin/pip" install --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/lint-requirements.txt"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/lint/bin" actionlint
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      # Rules in ruff.toml.
      - name: ruff
        run: git ls-files -z '*.py' | xargs -0 ruff check

      # Also runs the shellcheck above on every run: block of the workflows.
      - name: actionlint
        run: actionlint

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsecret-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
                -DBUILD_TESTING=OFF -DBUILD_TRANSLATIONS=OFF \
                -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build /tmp/qtkeychain/build -j"$(nproc)"
          cmake --install /tmp/qtkeychain/build

      - name: Compile translations
        run: |
          cd src
          mkdir -p resources/lang
          for ts in lang/ngPost_*.ts; do
            lrelease "$ts" -qm "resources/lang/$(basename "$ts" .ts).qm"
          done

      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../src/ngPost.pro CONFIG+=release CONFIG+=ngpost_werror
          make -j"$(nproc)"

      # The headless build is a documented mode -- qmake CONFIG+=no_hmi -- and
      # the base of the container image. Nothing else builds it, and it drifted
      # once already: a single dead QtGui include was enough to break it.
      - name: Build headless
        run: |
          mkdir -p build/headless
          cd build/headless
          qmake ../../src/ngPost.pro CONFIG+=release CONFIG+=ngpost_werror CONFIG+=no_hmi
          make -j"$(nproc)"

      - name: Headless build links no GUI and runs with no display
        run: |
          cd build/headless
          if ldd ngPost | grep -E 'libQt6Widgets|libQt6Gui|libQt6Charts|libX11|libGL'; then
            echo "the headless build must not link the graphical stack"
            exit 1
          fi
          env -u DISPLAY -u WAYLAND_DISPLAY -u QT_QPA_PLATFORM ./ngPost --version

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-linux
          path: build/linux/ngPost

  windows-msvc:
    name: Windows MSVC app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          aqtversion: '==3.2.0'
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        shell: pwsh
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git $env:TEMP\qtkeychain
          cd $env:TEMP\qtkeychain
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON `
                -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$env:QT_ROOT_DIR"
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Compile translations
        shell: pwsh
        run: |
          cd src
          New-Item -ItemType Directory -Force -Path resources/lang | Out-Null
          Get-ChildItem lang/ngPost_*.ts | ForEach-Object {
            lrelease $_.FullName -qm "resources/lang/$($_.BaseName).qm"
          }

      - name: Build
        shell: pwsh
        run: |
          cd src
          qmake ngPost.pro -spec win32-msvc CONFIG+=release CONFIG+=ngpost_werror
          nmake

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-windows-msvc
          path: src/release/ngPost.exe

  macos:
    name: macOS app
    # Qt 6.8.2/qmake links AGL; the macOS 26 SDK no longer ships it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.2'
          arch: 'clang_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
                -DBUILD_TESTING=OFF -DBUILD_TRANSLATIONS=OFF \
                -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build /tmp/qtkeychain/build -j"$(sysctl -n hw.ncpu)"
          cmake --install /tmp/qtkeychain/build

      - name: Compile translations
        run: |
          cd src
          mkdir -p resources/lang
          for ts in lang/ngPost_*.ts; do
            lrelease "$ts" -qm "resources/lang/$(basename "$ts" .ts).qm"
          done

      - name: Build
        run: |
          mkdir -p build/macos
          cd build/macos
          qmake ../../src/ngPost.pro CONFIG+=release CONFIG+=ngpost_werror
          make -j"$(sysctl -n hw.ncpu)"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-macos
          path: build/macos/ngPost.app/Contents/MacOS/ngPost
