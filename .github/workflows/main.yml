name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes this run: finishing it only delays the result that
# matters and holds a runner. Release publishing keeps its own group and is
# deliberately never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: C++ format (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the base of the pushed range must be in the clone to diff against
          fetch-depth: 0

      # Pinned by version and hash: clang-format output changes between major
      # versions, and this is the one .clang-format was calibrated with.
      - name: Install clang-format 18
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          echo "clang-format==18.1.8 --hash=sha256:2de122b8aa78ba49e326f974131caab2c79f4ae877c227cd4e3e5d82a98d21e5" \
            > "$RUNNER_TEMP/clang-format-requirements.txt"
          "$RUNNER_TEMP/clang-format/bin/pip" install --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/clang-format-requirements.txt"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-format.sh "$BASE_SHA"

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsecret-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
                -DBUILD_TESTING=OFF -DBUILD_TRANSLATIONS=OFF \
                -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build /tmp/qtkeychain/build -j"$(nproc)"
          cmake --install /tmp/qtkeychain/build

      - name: Compile translations
        run: |
          cd src
          mkdir -p resources/lang
          for ts in lang/ngPost_*.ts; do
            lrelease "$ts" -qm "resources/lang/$(basename "$ts" .ts).qm"
          done

      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../src/ngPost.pro CONFIG+=release
          make -j"$(nproc)"

      # The headless build is a documented mode -- qmake CONFIG+=no_hmi -- and
      # the base of the container image. Nothing else builds it, and it drifted
      # once already: a single dead QtGui include was enough to break it.
      - name: Build headless
        run: |
          mkdir -p build/headless
          cd build/headless
          qmake ../../src/ngPost.pro CONFIG+=release CONFIG+=no_hmi
          make -j"$(nproc)"

      - name: Headless build links no GUI and runs with no display
        run: |
          cd build/headless
          if ldd ngPost | grep -E 'libQt6Widgets|libQt6Gui|libQt6Charts|libX11|libGL'; then
            echo "the headless build must not link the graphical stack"
            exit 1
          fi
          env -u DISPLAY -u WAYLAND_DISPLAY -u QT_QPA_PLATFORM ./ngPost --version

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-linux
          path: build/linux/ngPost

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Built from Debian packages only: no Qt install step here, and a failure
      # means the image recipe rotted, not the project.
      - name: Build the image
        run: docker build --build-arg JOBS="$(nproc)" -t ngpost:ci .

      - name: The image runs, and holds what it promises
        run: |
          docker run --rm ngpost:ci --version
          docker run --rm --entrypoint sh ngpost:ci -c '
            set -e
            command -v par2 >/dev/null || { echo "par2cmdline missing"; exit 1; }
            command -v 7z   >/dev/null || { echo "7-Zip missing"; exit 1; }
            ! ldd /usr/local/bin/ngPost | grep -E "libQt6Widgets|libQt6Gui|libX11"
          '

      # The shipped configuration must parse with the binary of the same image:
      # both drifted apart once, the file still naming a CSV history and a
      # PAR2_PATH the tool keys replaced. --version and --help return before any
      # configuration is read; --history reads it, lists the empty history and
      # stops. Every diagnostic of ngPost carries a [hh:mm:ss.zzz] stamp, so a
      # clean read prints none -- given the folders the file names and the
      # owner-only mode its header asks for.
      - name: The shipped configuration parses
        run: |
          mkdir -p "$RUNNER_TEMP/config/ngPost" \
                   "$RUNNER_TEMP/data/input" "$RUNNER_TEMP/data/nzb" "$RUNNER_TEMP/data/tmp"
          cp ngPost.docker.conf "$RUNNER_TEMP/config/ngPost/ngPost.conf"
          chmod 700 "$RUNNER_TEMP/config/ngPost"
          chmod 600 "$RUNNER_TEMP/config/ngPost/ngPost.conf"
          output=$(docker run --rm -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" \
                     ngpost:ci --history 2>&1)
          echo "$output"
          if ! echo "$output" | grep -q "Using default config file: /config/ngPost/ngPost.conf"; then
            echo "the shipped configuration was not read"
            exit 1
          fi
          if echo "$output" | grep -E '^\[[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}\]'; then
            echo "the shipped configuration is not read cleanly"
            exit 1
          fi

  windows-msvc:
    name: Windows MSVC app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          aqtversion: '==3.2.0'
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        shell: pwsh
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git $env:TEMP\qtkeychain
          cd $env:TEMP\qtkeychain
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON `
                -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$env:QT_ROOT_DIR"
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Compile translations
        shell: pwsh
        run: |
          cd src
          New-Item -ItemType Directory -Force -Path resources/lang | Out-Null
          Get-ChildItem lang/ngPost_*.ts | ForEach-Object {
            lrelease $_.FullName -qm "resources/lang/$($_.BaseName).qm"
          }

      - name: Build
        shell: pwsh
        run: |
          cd src
          qmake ngPost.pro -spec win32-msvc CONFIG+=release
          nmake

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-windows-msvc
          path: src/release/ngPost.exe

  macos:
    name: macOS app
    # Qt 6.8.2/qmake links AGL; the macOS 26 SDK no longer ships it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.2'
          arch: 'clang_64'
          modules: 'qtcharts'
          cache: true

      - name: Build QtKeychain
        run: |
          git clone --depth=1 -b 0.15.0 https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
                -DBUILD_TESTING=OFF -DBUILD_TRANSLATIONS=OFF \
                -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build /tmp/qtkeychain/build -j"$(sysctl -n hw.ncpu)"
          cmake --install /tmp/qtkeychain/build

      - name: Compile translations
        run: |
          cd src
          mkdir -p resources/lang
          for ts in lang/ngPost_*.ts; do
            lrelease "$ts" -qm "resources/lang/$(basename "$ts" .ts).qm"
          done

      - name: Build
        run: |
          mkdir -p build/macos
          cd build/macos
          qmake ../../src/ngPost.pro CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngPost-macos
          path: build/macos/ngPost.app/Contents/MacOS/ngPost
