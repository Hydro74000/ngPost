name: Release signing key check

on:
  workflow_dispatch:
  push:
    branches: [devel, master]
    paths:
      - src/utils/update/update-key.pem
      - .github/scripts/check-release-key.py
      - .github/workflows/signing-check.yml

permissions:
  contents: read

jobs:
  public-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/check-release-key.py
  signing-roundtrip:
    needs: public-key
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prove the protected secret matches the public key (no publication)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python3 .github/scripts/check-release-key.py --require-private
